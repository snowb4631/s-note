# Single-container deployment. Secrets live in .env beside this file on the server.
# The front nginx belongs to another project on the same host, so the app joins that network.
name: snote

services:
  app:
    image: claudkim/snote:${SNOTE_TAG:?set SNOTE_TAG}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3300:3000"
    environment:
      RATE_LIMIT_BACKEND: memory
      RATE_LIMIT_HMAC_SECRET: ${RATE_LIMIT_HMAC_SECRET:?set RATE_LIMIT_HMAC_SECRET}
      EMAIL_SENDING_ENABLED: ${EMAIL_SENDING_ENABLED:-}
      PDF_HOURLY_LIMIT: ${PDF_HOURLY_LIMIT:-}
      ADSENSE_CLIENT: ${ADSENSE_CLIENT:-}
      ADSENSE_SLOT: ${ADSENSE_SLOT:-}
    networks:
      default: {}
      edge:
        aliases: [snote-app]
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:-trakit_default}
