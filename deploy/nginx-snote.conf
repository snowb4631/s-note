# Goes in the front nginx's conf.d. Cloudflare ranges: https://www.cloudflare.com/ips/
server {
    listen 80;
    server_name snote.stock-snow.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name snote.stock-snow.com;

    ssl_certificate     /etc/letsencrypt/live/snote.stock-snow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snote.stock-snow.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 5m;

    # The client's address, whether or not the record is proxied. The header counts only from these ranges.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Resolved per request, so nginx still starts when the app is down.
    resolver 127.0.0.11 valid=10s;
    set $snote_upstream http://snote-app:3000;

    location / {
        proxy_pass $snote_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# The bare domain points at snote. ads.txt stays here because AdSense reads it from the root.
server {
    listen 80;
    server_name stock-snow.com;

    location = /ads.txt {
        default_type text/plain;
        return 200 "google.com, pub-7976728626582580, DIRECT, f08c47fec0942fa0\n";
    }
    location / {
        return 302 https://snote.stock-snow.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name stock-snow.com;

    # Cloudflare proxies this name and already accepts the certificate the server presents for it.
    ssl_certificate     /etc/letsencrypt/live/trakit.stock-snow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trakit.stock-snow.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location = /ads.txt {
        default_type text/plain;
        return 200 "google.com, pub-7976728626582580, DIRECT, f08c47fec0942fa0\n";
    }
    location / {
        return 302 https://snote.stock-snow.com$request_uri;
    }
}
